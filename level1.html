<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Duble Trouble — Rope Line</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#14141c; color:#e6e6f0;
               font-family: system-ui, -apple-system, sans-serif;
               -webkit-user-select:none; user-select:none; }

  /* ---- Three.js Background Canvas ---- */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }
/* ---- Back Button ---- */
  #backBtn {
    position: fixed;
    top: 6px;
    left: 8px;
    z-index: 15;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #45455e;
    background: rgba(36, 36, 48, 0.85);
    color: #e6e6f0;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #backBtn:hover { background: rgba(58, 58, 76, 0.95); }
  /* Update existing #hud rule to shift it right of the back button */
  #hud { position:fixed; top:6px; left:100px; font:11px ui-monospace, monospace;
         color:#6a6a80; pointer-events:none; z-index:5; }
  /* Replaces the old #lobby host/join screen — this page only ever
     arrives via hand-off from the lobby (see HANDOFF CONTRACT in
     netcode.js), so there's nothing to host/join here. Just a status
     line while the session resumes, or an error if there's nothing to
     resume. */
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:10px; padding:24px; z-index:20; background:#14141c;
          text-align:center; }
  #boot h1 { margin:0; font-size:20px; font-weight:600; }
  #bootStatus { font-size:13px; color:#8a8aa0; }

  #ended { position:fixed; inset:0; z-index:30; display:none; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; background:rgba(20,20,28,.94);
           text-align:center; padding:24px; }
  #ended.on { display:flex; }
  #endedBtn { font:inherit; padding:11px 18px; border-radius:8px; border:1px solid #3a3a4c;
              background:#242430; color:#e6e6f0; cursor:pointer; }

  #stage { position:fixed; inset:0; display:none; z-index: 1; }
  #stage.on { display:block; }
  canvas#game { display:block; width:100%; height:100%; touch-action:none; background: transparent; }
  #hud { position:fixed; top:6px; left:8px; font:11px ui-monospace, monospace;
         color:#6a6a80; pointer-events:none; z-index:5; }

  #youAre { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:5; display:none;
            align-items:center; gap:6px; font:12px system-ui, sans-serif;
            color:#c8c8d8; background:rgba(20,20,28,.6); padding:5px 10px;
            border-radius:20px; pointer-events:none; }
  #youAre.on { display:flex; }
  #youAreSwatch { width:14px; height:14px; border-radius:4px; box-shadow:0 0 0 1px rgba(255,255,255,.25); }

  /* Countdown before play begins. The host's simulation is frozen while
     this runs (see frame()), so nothing can kill anyone during it. */
  #countdown { position:fixed; inset:0; z-index:25; display:none;
               flex-direction:column; align-items:center; justify-content:center;
               gap:6px; pointer-events:none; background:rgba(14,14,21,.45); }
  #countdown.on { display:flex; }
  #cdNum { font:700 92px system-ui, sans-serif; color:#ffe08a;
           text-shadow:0 4px 24px rgba(0,0,0,.7); line-height:1;
           animation:cdPop .45s ease-out; }
  #cdHint { font-size:14px; color:#c8c8d8; }
  @keyframes cdPop { from { transform:scale(.55); opacity:0 } to { transform:scale(1); opacity:1 } }

  /* Transient centre-screen message (death, restart, someone exited). */
  #toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
           z-index:22; display:none; font:600 22px system-ui, sans-serif;
           color:#e6e6f0; background:rgba(20,20,28,.82); padding:12px 22px;
           border-radius:12px; pointer-events:none; text-align:center;
           border:1px solid #3a3a4c; }
  #toast.on { display:block; }

  #exitProg { position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
              z-index:5; display:none; font:12px system-ui, sans-serif; color:#c8c8d8;
              background:rgba(20,20,28,.6); padding:5px 12px; border-radius:20px;
              pointer-events:none; }
  #exitProg.on { display:block; }

  #touch { display:none; position:fixed; inset:auto 0 0 0; z-index:10;
           padding:0 16px 16px; justify-content:space-between; pointer-events:none; }
  @media (pointer: coarse) { #touch { display:flex; } }
  .pad { display:flex; gap:10px; pointer-events:auto; }
  /* 50px is about the smallest a thumb target should go — below ~44px
     accuracy falls off badly, and these get pressed under pressure. */
  .tbtn { width:50px; height:50px; border-radius:50%; border:1px solid #45455e;
          background:rgba(40,40,58,.72); color:#d8d8ea; font-size:16px;
          display:flex; align-items:center; justify-content:center;
          backdrop-filter: blur(3px); }
  .tbtn.pressed { background:rgba(90,90,130,.9); }

  #rotate { position:fixed; inset:0; z-index:40; display:none;
            flex-direction:column; align-items:center; justify-content:center;
            gap:14px; background:#14141c; text-align:center; padding:24px; }
  #rotate span { font-size:44px; }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display:flex; } }

  /* ---- voice/settings overlay (top-right, persistent once in-game) ---- */
  #voiceBar { position:fixed; top:6px; right:8px; z-index:15; display:none;
              align-items:center; gap:6px; }
  #voiceBar.on { display:flex; }
  .vbtn { width:30px; height:30px; border-radius:50%; border:1px solid #45455e;
          background:rgba(36,36,48,.85); color:#d8d8ea; font-size:14px; cursor:pointer;
          display:flex; align-items:center; justify-content:center; padding:0; }
  .vbtn.muted { background:#5a2f36; border-color:#7a3f46; }
  .vdots { display:flex; gap:4px; }
  .vdot { width:8px; height:8px; border-radius:50%; background:#3a3a4c; }
  .vdot.speaking { background:#5fd68a; box-shadow:0 0 4px #5fd68a; }

  #voicePanel { position:fixed; top:44px; right:8px; z-index:15; display:none;
                flex-direction:column; gap:10px; background:rgba(24,24,32,.95);
                border:1px solid #3a3a4c; border-radius:10px; padding:12px; width:220px;
                font-size:13px; }
  #voicePanel.on { display:flex; }
  .vrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .seg { display:flex; border:1px solid #3a3a4c; border-radius:6px; overflow:hidden; }
  .seg button { font:inherit; font-size:12px; padding:5px 8px; border:none; background:#242430;
                color:#e6e6f0; cursor:pointer; }
  .seg button.active { background:#3a3a5c; }
  .peerRow { display:flex; align-items:center; gap:6px; }
  .peerRow input[type=range] { flex:1; }
  #leaveBtn { font:inherit; padding:8px; border-radius:6px; border:1px solid #5a2f36;
              background:#3a2226; color:#e6e6f0; cursor:pointer; }
</style>
</head>
<body>

<!-- Three.js Background Canvas -->
<canvas id="bg-canvas"></canvas>

<div id="rotate">
  <span>&#8635;</span>
  <div>Rotate your device to landscape</div>
  <div style="font-size:13px;color:#8a8aa0">This is shared-screen co-op &mdash; it needs the width.</div>
</div>

<div id="boot">
  <h1>Duble Trouble</h1>
  <div id="bootStatus">Resuming session…</div>
  <button id="soloBtn" type="button" style="display:none;font:inherit;padding:11px 18px;
    border-radius:8px;border:1px solid #3a3a4c;background:#242430;color:#e6e6f0;cursor:pointer;">
    Test solo (no lobby)
  </button>
</div>

<div id="ended">
  <div style="font-size:18px;font-weight:600" id="endedMsg">Session ended</div>
  <button id="endedBtn">Back</button>
</div>

<div id="stage">
  <canvas id="game"></canvas>
</div>
<button id="backBtn" type="button" aria-label="Back to Lobby">&#8592; Lobby</button>
<div id="hud"></div>

<div id="toast"></div>

<div id="youAre"><span id="youAreSwatch"></span><span>You</span></div>

<div id="voiceBar">
  <div class="vdots" id="voiceDots"></div>
  <button class="vbtn" id="selfMuteBtn" type="button" aria-label="Mute microphone">&#127908;</button>
  <button class="vbtn" id="settingsBtn" type="button" aria-label="Voice settings">&#9881;</button>
</div>
<div id="voicePanel">
  <div class="vrow">
    <span>Voice mode</span>
    <div class="seg" id="modeSwitch">
      <button type="button" data-mode="always">Always on</button>

  </div>

</div>

    <div class="tbtn" id="btnDown">&#9660;</div>
  </div>
  <div class="pad">
    <div class="tbtn" id="btnAction">&#9995;</div>
    <div class="tbtn" id="btnJump">&#9650;</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="engine.js"></script>

<!-- ==========================================================================
     Three.js Atmospheric Dark Valley Background Setup (Violet Grass Accent)
     ========================================================================== -->
<script>
(function() {
  "use strict";
  const canvas = document.getElementById('bg-canvas');
  
  // High-performance context setup
  const renderer = new THREE.WebGLRenderer({ 
    canvas: canvas, 
    antialias: false, 
    powerPreference: "high-performance",
    depth: true,
    stencil: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

  const scene = new THREE.Scene();
  
  // Dark Twilight / Synthwave palette
  const skyColor = 0x0d0b18;   // Deep midnight purple
  const fogColor = 0x18122b;   // Soft atmospheric twilight
  scene.background = new THREE.Color(skyColor);
  scene.fog = new THREE.FogExp2(fogColor, 0.015);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 16, 45);
  camera.lookAt(0, 4, -50);

  // Distant warm horizon light
  const sunLight = new THREE.DirectionalLight(0xff6b4a, 1.4);
  sunLight.position.set(0, 10, -100);
  scene.add(sunLight);

  // Cool ambient fill for the valley floor
  const hemiLight = new THREE.HemisphereLight(0x7c4da1, 0x120c1f, 0.9);
  scene.add(hemiLight);

  // Low-poly terrain geometry (30x30 for top performance)
  const width = 160;
  const depth = 240;
  const segments = 30;

  const geometry = new THREE.PlaneGeometry(width, depth, segments, segments);
  geometry.rotateX(-Math.PI / 2);

  const pos = geometry.attributes.position;
  
  // Create an array to hold per-vertex RGB colors for violet grass stylization
  const colors = new Float32Array(pos.count * 3);

  // Defining color palette shades (RGB values normalized 0.0 - 1.0)
  const colorGrassTop = new THREE.Color(0x8b41b0);    // Bright Violet Grass Top
  const colorGrassBase = new THREE.Color(0x4a1970);   // Deep Violet Slope
  const colorValleyFloor = new THREE.Color(0x1a1330); // Dark Midnight Base

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);

    const distFromCenter = Math.abs(x);
    let height = Math.pow(distFromCenter / 11, 2.1);

    const hillNoise = Math.sin(x * 0.12) * Math.cos(z * 0.08) * 3.5 +
                      Math.sin(z * 0.04) * 4;
    height += hillNoise;

    if (distFromCenter < 12) {
      height = Math.sin(z * 0.08) * 0.7;
    }

    pos.setY(i, height);

    // Vertex color calculations based on height & distance
    const vertexColor = new THREE.Color();
    if (height > 6) {
      // High hill peaks -> Vibrant Violet Grass tips
      const factor = Math.min(1.0, (height - 6) / 14);
      vertexColor.copy(colorGrassBase).lerp(colorGrassTop, factor);
    } else if (height > 1) {
      // Low slopes -> Medium Violet tint
      const factor = (height - 1) / 5;
      vertexColor.copy(colorValleyFloor).lerp(colorGrassBase, factor);
    } else {
      // Path / low valley floor -> Midnight Purple Shadow
      vertexColor.copy(colorValleyFloor);
    }

    colors[i * 3]     = vertexColor.r;
    colors[i * 3 + 1] = vertexColor.g;
    colors[i * 3 + 2] = vertexColor.b;
  }

  // Attach vertex colors to geometry
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  // Material configured to use per-vertex colors
  const terrainMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.8,
    metalness: 0.15,
    flatShading: true
  });

  const terrain = new THREE.Mesh(geometry, terrainMaterial);
  terrain.position.z = -50;
  scene.add(terrain);

  // 30 FPS render loop gate
  let lastRender = 0;
  const fpsInterval = 1000 / 30; 

  function animateBG(currentTime) {
    requestAnimationFrame(animateBG);

    const elapsed = currentTime - lastRender;
    if (elapsed > fpsInterval) {
      lastRender = currentTime - (elapsed % fpsInterval);
      
      // Smooth continuous forward movement
      terrain.position.z = -50 + ((currentTime * 0.0025) % 20);
      renderer.render(scene, camera);
    }
  }
  requestAnimationFrame(animateBG);

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }, 100);
  });
})();
</script>
<!-- ==========================================================================
     Level: Rope Line — inlined here in place of level.js.
     Everything tunable lives in the SETTINGS block at the top.
     ========================================================================== -->
<script>
(function () {
"use strict";
try {

const { StaticBody, Entity, TriggerZone, BouncingBall, Player, PHYSICS } = window.Engine;

/* =======================================================================
   SETTINGS — tune these, everything below is derived.
   ======================================================================= */

// ---- world frame ----
const H_          = 620;   // level height
const CEILING_Y   = 60;    // y the ropes hang from
const LEDGE_Y     = 470;   // top surface of the start ledge
const LEDGE_W     = 180;   // width of the start ledge
const PIT_DEATH_PAD = 80;  // deathY = H_ + this

// ---- ropes ----
// One entry per rope, left to right. Add or remove entries freely.
// restLen      : length with nobody on it, for a 2-player team
// shrinkPerHead: how much SHORTER it starts for each player beyond the
//                second — a bigger team has to build a taller stack
// growPerRider : extra length per player currently hanging on it
// maxLen       : hard ceiling
// minLen       : floor, so a big team can't shrink it out of reach entirely
//
// Once every player is on the rope at the same time the length LATCHES:
// from then on it only ever grows, never retracts, so the last player up
// can't be stranded by someone else letting go.
const ROPES = [
  // Rope A — the "just barely" one. Short enough that a lone player can't
  // reach it: two must stack, the top one catches the tail, and the rope
  // then pays out far enough for the next player to reach from the ledge.
  // Every extra rider lowers it again, so a 4-player team ends up with a
  // much longer rope than a 2-player one.
  { x: 300,  restLen: 340, shrinkPerHead: 45, growPerRider: 60,
             maxLen: 520, minLen: 200 },
  { x: 700,  restLen: 380 },
  { x: 1130, restLen: 360 },
];

// Each rope hangs from its own small anchor block instead of a
// full-width ceiling beam. Set ANCHOR_STYLE to 'none' to have the ropes
// hang from nothing at all (pure mid-air).
const ANCHOR_STYLE = 'block';   // 'block' | 'none'
const ANCHOR_W     = 40;
const ANCHOR_H     = 14;
const ANCHOR_SOLID = true;      // false = decorative only, can't stand on it

const EXIT_GAP     = 390;  // horizontal gap from the last rope to the exit platform
const EXIT_PLAT_W  = 190;
const EXIT_PLAT_Y  = 430;  // top surface of the exit platform

// ---- rope feel ----
const ROPE_DAMPING    = 0.55;  // 1/s. higher = swing dies faster
const PUMP_ACCEL      = 0.8;   // rad/s^2 added by left/right while hanging
const MAX_OMEGA       = 3;   // rad/s angular speed cap
const CLIMB_SPEED     = 130;   // px/s up the rope while JUMP (W) is held
const SLIDE_SPEED     = 190;   // px/s down the rope while DOWN (S) is held
const MIN_DIST        = 34;    // closest you can climb to the pivot
const EXPAND_SPEED    = 100;   // px/s the rope lengthens after first grab
const GRAB_RADIUS     = 23;    // px from the rope line that counts as a catch
                               // (ACTION must be held to actually grab)
const REGRAB_COOLDOWN = 0.30;  // s after letting go before you can catch again
// A remote player's buttons arrive over the network, so a single dropped
// packet reads as "released" for one tick. Without debouncing, that false
// release registers as a fresh press the moment the next packet lands —
// which is exactly a grab followed instantly by a let-go. ACTION must
// read as up for this long before we believe it.
const ACTION_DEBOUNCE = 0.12;  // s
const MIN_HANG_TIME   = 0.25;  // s on the rope before E can release you
const RELEASE_BOOST   = 280;   // upward kick on release — E is a real jump
                               // off the rope, not just a let-go. Lower it
                               // toward 0 for a pure swing-momentum launch.
const RELEASE_VX_MULT = 1.15;  // multiplier on the swing velocity you keep

// ---- cosmetics ----
// Ropes are no longer made of synced entities. Syncing 7 coils x 3 ropes
// meant 21 extra dynamic entities in every snapshot at SNAPSHOT_HZ, purely
// so the client could draw a line — which is what was choking phones.
// A rope is a straight segment, so the client only needs its angle and
// length: 3 ropes x 3 numbers, sent at ROPE_SYNC_HZ over the level message
// channel, and integrated locally in between.
const TIP_SIZE       = 6;      // the one synced entity per rope
const ROPE_SEGMENTS  = 8;      // curve smoothness, purely local — free
const ROPE_COLOR     = '#c9a36b';
const PLATFORM_COLOR = '#a778d6';
const GOAL_COLOR     = '#f0c419';

const VIEW_MODE = 'follow';

// Draws the input-source readout top-left of the beam. Set false once
// grabbing is confirmed working.
const ROPE_DEBUG = true;

// Fixed integration slice for the pendulum, independent of framerate.
const ROPE_STEP = 1 / 60;

/* =======================================================================
   derived layout
   ======================================================================= */
const lastRope = ROPES[ROPES.length - 1];
const EXIT_X   = lastRope.x + EXIT_GAP;
const LEVEL_W  = EXIT_X + EXIT_PLAT_W + 60;

/* =======================================================================
   ASSUMPTIONS (flagged — these are the only lines likely to need a fix)

   1. Entity.update(dt) is called once per sub-step by World. If your
      engine passes (dt, world) that's fine — we ignore extra args and use
      a captured `theWorld` instead.                    -> RopeSystem.update
   2. Player exposes its held buttons. We read them defensively through
      readInput() below, which tries .input / .btn / .inputMask. If none
      match, ropes still swing but pumping/climbing won't respond.
                                                        -> readInput()
   3. BouncingBall instances are picked up for sync by
      world.entities.filter(e => e.isBouncingBall) — so rope coils sync
      for free without a TYPE_REGISTRY change, and must NOT go in any nw
      array.                                            -> RopeNode
   4. Entity updates only run on the host (clients interpolate
      snapshots), so all rope logic is host-authoritative by default.
   ======================================================================= */

let theWorld = null;
let ropeSystem = null;

// --- input plumbing -----------------------------------------------------
// The Player entity itself carries no button state (confirmed: the
// resolver found nothing on it). netcode's Host keeps input in its own
// per-slot records, so we look there instead, and fall back to the local
// InputManager for the host's own player.
//
// Nothing here assumes a field name. Each tick we walk Host.nw.players,
// find the Player entity inside each record, and find the button state
// inside the same record — either an object of booleans or a numeric
// bitmask (netcode BTN: LEFT 1, RIGHT 2, JUMP 4, ACTION 8).
const NO_INPUT = { left: false, right: false, jump: false, action: false, down: false };
let inputMap = new Map();   // Player -> {left,right,jump,action}

function looksLikeButtons(o) {
  return o && typeof o === 'object' &&
         ('action' in o || 'jump' in o) && ('left' in o || 'right' in o);
}
function fromMask(m) {
  return { left: !!(m & 1), right: !!(m & 2), jump: !!(m & 4),
           action: !!(m & 8), down: !!(m & 16) };
}
function findButtons(rec, depth) {
  if (!rec || typeof rec !== 'object' || depth > 2) return null;
  if (looksLikeButtons(rec)) return { v: rec, how: 'obj' };
  for (const k in rec) {
    const val = rec[k];
    if (looksLikeButtons(val)) return { v: val, how: 'obj:' + k };
  }
  for (const k in rec) {
    if (typeof rec[k] === 'number' && /mask|bits|btn|input/i.test(k)) {
      return { v: fromMask(rec[k]), how: 'mask:' + k };
    }
  }
  return null;
}
function findPlayer(rec) {
  if (rec instanceof Player) return rec;
  if (!rec || typeof rec !== 'object') return null;
  for (const k of ['player', 'entity', 'p', 'ent', 'body']) {
    if (rec[k] instanceof Player) return rec[k];
  }
  for (const k in rec) if (rec[k] instanceof Player) return rec[k];
  return null;
}

// The local player's own buttons never go through the network, so grab
// them straight off whichever input singleton the page exposes.
function localButtons() {
  const cands = [window.__gameInput, window.Input, window.input,
                 window.Game && window.Game.input];
  for (const c of cands) {
    if (looksLikeButtons(c)) return { v: c, how: 'local' };
    if (c && looksLikeButtons(c.state)) return { v: c.state, how: 'local.state' };
    for (const k of ['state', 'buttons', 'btn', 'held', 'current']) {
      if (c && looksLikeButtons(c[k])) return { v: c[k], how: 'local.' + k };
    }
    if (c && typeof c.getState === 'function') {
      try { const st = c.getState(); if (looksLikeButtons(st)) return { v: st, how: 'local.getState' }; }
      catch (e) {}
    }
  }
  return null;
}

function refreshInputs() {
  inputMap = new Map();
  let how = null;
  const H = window.Netcode && window.Netcode.Host;
  const recs = H && H.nw && H.nw.players;
  if (recs && typeof recs.forEach === 'function') {
    recs.forEach((rec, slot) => {
      const p = findPlayer(rec);
      const b = findButtons(rec, 0);
      if (p && b) { inputMap.set(p, b.v); how = how || ('host:' + b.how); }
    });
  }
  // host's own player: prefer the live local input if the record didn't
  // carry it (some netcode builds apply local input without storing it).
  const loc = localButtons();
  if (loc && H && typeof H.mySlot !== 'undefined' && recs) {
    const rec = recs.get ? recs.get(H.mySlot) : null;
    const p = findPlayer(rec);
    if (p) {
      // The host's own buttons are read straight off the InputManager and
      // OR'd over whatever the slot record held. If netcode's mask is
      // stale or missing a bit for the local player, this still works;
      // remote players rely on the mask alone.
      const rec_v = inputMap.get(p);
      inputMap.set(p, rec_v ? {
        left:   rec_v.left   || !!loc.v.left,
        right:  rec_v.right  || !!loc.v.right,
        jump:   rec_v.jump   || !!loc.v.jump,
        action: rec_v.action || !!loc.v.action,
        down:   rec_v.down   || !!loc.v.down,
      } : loc.v);
      how = how || loc.how;
    }
  }
  window.__ropeInput = how || (loc ? loc.how + ' (unmapped)' : 'NOT FOUND');
  if (ROPE_DEBUG) {
    // raw mask of every mapped player, so a missing DOWN bit (16) is
    // visible as a number rather than guessed at
    const masks = [];
    if (recs && typeof recs.forEach === 'function') {
      recs.forEach((rec) => {
        const p = findPlayer(rec);
        if (!p) return;
        const m = (typeof p._mask === 'number') ? p._mask
                : (typeof rec._mask === 'number') ? rec._mask : null;
        masks.push(m === null ? '?' : m);
      });
    }
    window.__ropeMask = masks.join(',') || '-';
    window.__ropeLocDown = loc ? String(!!loc.v.down) : '-';
  }
  window.__ropeLoc = loc ? loc.how : '-';
}

// DOWN is a real wire bit now (BTN.DOWN = 16), so `inp.down` works for
// local and remote players alike and there is no relay to maintain.
function readInput(p) {
  const v = inputMap.get(p);
  if (!v) return NO_INPUT;
  return { left: !!v.left, right: !!v.right, jump: !!v.jump,
           action: !!v.action, down: !!v.down };
}

/* ---- one rope: pivot, angle, riders ---- */
class Rope {
  constructor(def, index) {
    this.px = def.x;
    this.py = CEILING_Y;
    this.restLen = def.restLen;
    this.shrinkPerHead = def.shrinkPerHead || 0;
    this.growPerRider = def.growPerRider || 0;
    this.maxLen = def.maxLen || def.restLen;
    this.minLen = def.minLen || 120;
    this.latched = false;   // true once everyone has been on at once
    this.len = def.restLen;
    this.theta = 0;      // radians from vertical, + = right
    this.omega = 0;
    this.index = index;
  }
  tipX() { return this.px + Math.sin(this.theta) * this.len; }
  tipY() { return this.py + Math.cos(this.theta) * this.len; }
  pointAt(d) {
    return { x: this.px + Math.sin(this.theta) * d,
             y: this.py + Math.cos(this.theta) * d };
  }
  // shortest distance from a point to the rope line, plus how far down it is
  project(x, y) {
    const dx = x - this.px, dy = y - this.py;
    let d = dx * Math.sin(this.theta) + dy * Math.cos(this.theta);
    d = Math.max(0, Math.min(this.len, d));
    const p = this.pointAt(d);
    return { d, dist: Math.hypot(x - p.x, y - p.y) };
  }
}

/* ---- the controller: swings every rope, moves every rider ---- */
class RopeSystem extends Entity {
  constructor(ropes) {
    super(0, 0, 1, 1);
    this.solid = false;
    this.ropes = ropes;
    this.riders = new Map();   // Player -> { rope, d }
    this.cooldown = new Map(); // Player -> seconds left
    this.act = new Map();      // Player -> {down, upFor, rising} debounced E
    this.hangTime = new Map(); // Player -> s spent on the current rope
    this.lastGen = -1;
    this.lastDriven = 0;
  }

  // Aliased below to every plausible per-tick hook name, because the
  // engine's entity tick is not called `update` here (the debug readout
  // proved it never fired). Whichever name World actually calls wins; if
  // NONE of them are called, the rAF fallback at the bottom of this file
  // drives it instead, host-side only.
  // Fixed-step wrapper. Whatever dt arrives (sim frame or rAF), it gets
  // consumed in 1/60 slices, so the pendulum integrates identically no
  // matter the framerate. Without this the swing speed tracked the
  // display refresh, which is what made it lurch a box at a time.
  tickRope(dt) {
    this.lastDriven = performance.now();
    window.__ropeDriver = this._driver || 'engine';
    if (!(dt > 0)) return;
    this._acc = (this._acc || 0) + Math.min(dt, 0.1);
    let guard = 0;
    while (this._acc >= ROPE_STEP && guard++ < 8) {
      this._acc -= ROPE_STEP;
      this.stepRope(ROPE_STEP);
    }
    // riders are re-pinned every frame, not just on a fixed slice, so
    // they never lag a frame behind the physics pass that just moved them
    this.pinRiders();
  }

  stepRope(dt) {
    const world = theWorld;
    if (!world || !dt) return;
    this._lastDt = dt;

    // a level reset re-spawns everyone on the ledge — drop all riders
    if (world.resetGeneration !== this.lastGen) {
      this.lastGen = world.resetGeneration;
      this.riders.clear();
      this.cooldown.clear();
      this.act.clear();
      this.hangTime.clear();
      for (const r of this.ropes) { r.theta = 0; r.omega = 0; r.latched = false; }
    }

    refreshInputs();

    const players = world.entities.filter(e => e instanceof Player && !e.dead);

    // ---- debounced ACTION edges, computed once per tick for everyone ----
    // A brief gap in the input stream no longer counts as a release, so a
    // press can't be double-read as grab-then-release.
    for (const p of players) {
      const raw = readInput(p).action;
      let a = this.act.get(p);
      if (!a) { a = { down: false, upFor: 99, rising: false }; this.act.set(p, a); }
      a.rising = false;
      if (raw) {
        a.upFor = 0;
        if (!a.down) { a.down = true; a.rising = true; }
      } else {
        a.upFor += dt;
        if (a.upFor >= ACTION_DEBOUNCE) a.down = false;
      }
    }
    for (const [p, v] of this.riders) {
      this.hangTime.set(p, (this.hangTime.get(p) || 0) + dt);
    }
    if (ROPE_DEBUG) {
      window.__ropeAction = players.filter(p => readInput(p).action).length + '/' + players.length;
      window.__ropeRiders = this.riders.size;
    }

    for (const [p, t] of this.cooldown) {
      const left = t - dt;
      if (left <= 0) this.cooldown.delete(p); else this.cooldown.set(p, left);
    }

    // ---- catching ----
    for (const p of players) {
      if (this.riders.has(p) || this.cooldown.has(p)) continue;
      // CONTROLS: ACTION (E) = grab, and press it again to let go.
      //           JUMP   (W) = climb up, DOWN (S) = slide down.
      // Grab fires on a debounced rising edge, so the press that grabs
      // can never also be read as the press that releases.
      const a = this.act.get(p);
      if (!a || !a.rising) continue;
      a.rising = false;              // consumed by the grab
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      let best = null, bestDist = GRAB_RADIUS;
      for (const r of this.ropes) {
        const pr = r.project(cx, cy);
        if (pr.dist < bestDist) { bestDist = pr.dist; best = { r, d: pr.d }; }
      }
      if (best) this.attach(p, best.r, best.d);
    }

    // ---- swing each rope ----
    for (const r of this.ropes) {
      // Length tracks how many players are hanging on it. Riders slide
      // down with the rope as it pays out (and are carried up as it
      // retracts) so nobody's grip position jumps.
      let onThisRope = 0;
      for (const v of this.riders.values()) if (v.rope === r) onThisRope++;

      // Starting length shrinks with team size: two players need a short
      // stack, four need a tall one. Then it pays out per rider.
      const heads = Math.max(2, players.length);
      const start = Math.max(r.minLen,
                             r.restLen - r.shrinkPerHead * (heads - 2));
      let target = Math.min(r.maxLen, start + r.growPerRider * onThisRope);

      // Everyone on at once? Latch, and never let it retract again.
      if (onThisRope >= players.length && players.length > 0) r.latched = true;
      if (r.latched) target = Math.max(target, r.len);
      if (Math.abs(target - r.len) > 0.5) {
        const before = r.len;
        const dir = target > r.len ? 1 : -1;
        r.len += dir * EXPAND_SPEED * dt;
        if ((dir > 0 && r.len > target) || (dir < 0 && r.len < target)) r.len = target;
        const scale = r.len / before;
        for (const v of this.riders.values()) {
          if (v.rope === r) v.d = Math.max(MIN_DIST, Math.min(r.len, v.d * scale));
        }
      }

      let pump = 0, riderCount = 0;
      for (const [p, v] of this.riders) {
        if (v.rope !== r) continue;
        riderCount++;
        const inp = readInput(p);
        if (inp.right) pump += 1;
        if (inp.left)  pump -= 1;
      }
      if (riderCount > 0) pump /= riderCount;

      const g = (PHYSICS && PHYSICS.GRAVITY) || 1700;
      r.omega += (-(g / r.len) * Math.sin(r.theta) - ROPE_DAMPING * r.omega
                  + pump * PUMP_ACCEL) * dt;
      r.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, r.omega));
      r.theta += r.omega * dt;

      // The tip is the only thing the client needs to see.
      if (r.tip) {
        const pt = r.pointAt(r.len);
        r.tip.x = pt.x - TIP_SIZE / 2;
        r.tip.y = pt.y - TIP_SIZE / 2;
        r.tip.vx = 0; r.tip.vy = 0;
      }

    }

  }

  // Called every frame, AFTER the physics pass has run. Gravity has
  // already moved the rider by then; this puts them back on the rope and
  // cancels the velocity that would move them again next step. Doing this
  // before physics instead is what made riders bob up and down.
  pinRiders() {
    const world = theWorld;
    if (!world) return;
    for (const [p, v] of [...this.riders]) {
      const players = world.entities;
      if (players.indexOf(p) === -1 || p.dead) { this.riders.delete(p); continue; }
      const r = v.rope, inp = readInput(p);

      // W (jump) climbs up, S slides down. Sliding stops at the tail —
      // you drop off with E, not by sliding past the end.
      if (inp.jump) v.d = Math.max(MIN_DIST, v.d - CLIMB_SPEED * this._lastDt);
      if (ROPE_DEBUG) window.__ropeSliding = String(!!inp.down);
      if (inp.down) v.d = v.d + SLIDE_SPEED * this._lastDt;
      v.d = Math.max(MIN_DIST, Math.min(v.d, r.len));

      // E pressed again lets go, carrying the swing velocity. Ignored for
      // the first MIN_HANG_TIME so a laggy grab can't bounce straight off.
      const a = this.act.get(p);
      if (a && a.rising && (this.hangTime.get(p) || 0) >= MIN_HANG_TIME) {
        a.rising = false;
        this.release(p, v);
        continue;
      }

      const pt = r.pointAt(v.d);
      p.vx = 0; p.vy = 0;
      p.x = pt.x - p.w / 2;
      p.y = pt.y - p.h / 2;
      p.grounded = false;
      if (p.jumpBuffer !== undefined) p.jumpBuffer = 0;
      p.facing = r.omega >= 0 ? 1 : -1;
    }
  }

  attach(p, rope, d) {
    // carry your momentum in: convert linear velocity to angular
    const tx = Math.cos(rope.theta), ty = -Math.sin(rope.theta);
    const tang = (p.vx || 0) * tx + (p.vy || 0) * ty;
    const dd = Math.max(MIN_DIST, d);
    const w = tang / dd;
    rope.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, rope.omega + w * 0.6));
    this.riders.set(p, { rope, d: dd });
    this.hangTime.set(p, 0);
    p.vx = 0; p.vy = 0;
  }

  release(p, v) {
    const r = v.rope;
    const vx = r.omega * v.d * Math.cos(r.theta) * RELEASE_VX_MULT;
    const vy = -r.omega * v.d * Math.sin(r.theta) - RELEASE_BOOST;
    p.vx = vx; p.vy = vy;
    this.riders.delete(p);
    this.hangTime.delete(p);
    this.cooldown.set(p, REGRAB_COOLDOWN);
  }
}

// Whatever the engine calls, route it to tickRope. Harmless if the engine
// calls more than one of these — tickRope is idempotent per dt.
for (const name of ['update', 'step', 'tick', 'fixedUpdate', 'simulate', 'onTick']) {
  if (!RopeSystem.prototype[name]) {
    RopeSystem.prototype[name] = function (dt) { this.tickRope(dt); };
  }
}

/* ---- rope sync ------------------------------------------------------
   ONE tiny entity per rope — its tip — synced through the ordinary
   snapshot path. That's 3 entities instead of the 21 coils this started
   with, and nothing touches Netcode.Client, which is what stopped the
   join flow from working. The client draws from the pivot (known from the
   ROPES config) to the synced tip, so angle and length come for free and
   no rope state has to be sent at all. ---- */
class RopeTip extends BouncingBall {
  constructor(x, y) {
    super(x, y, TIP_SIZE, TIP_SIZE, {
      vx: 0, vy: 0, friction: 0, minSpeed: 0,
      killsPlayers: false, bounds: null, color: ROPE_COLOR,
    });
    this.solid = false;
    this.kind = 'ropetip';
  }
  update() { /* driven by RopeSystem */ }
}

/* =======================================================================
   Level
   ======================================================================= */
const ropeObjs = ROPES.map((d, i) => new Rope(d, i));

window.Level = {
  WIDTH: LEVEL_W,
  HEIGHT: H_,
  VIEW_MODE: VIEW_MODE,

  // stacked spawn — slot 0 on the ledge, each next slot on the one below,
  // which is how the first player gets high enough to reach rope A.
  spawnPoint(slot) {
    return { x: 60 + (slot % 2) * 34, y: LEDGE_Y - 40 - Math.floor(slot / 2) * 42 };
  },

  build(world, nw) {
    theWorld = world;
    world.deathY = H_ + PIT_DEATH_PAD;
    // falling into the pit must kill, so the camera's bottom wall can't
    // be solid (same reasoning as Arrow Gap).
    world.cameraOpts = { blockBottom: false };

    // start ledge
    const ledge = new StaticBody(0, LEDGE_Y, LEDGE_W, 24);
    ledge.color = PLATFORM_COLOR;
    world.add(ledge);

    // Small anchor block per rope. Built in rope order so host and client
    // still produce identical static ids. (The old full-width beam also
    // acted as a lid stopping you launching over the puzzle — that job is
    // now the camera's top wall.)
    if (ANCHOR_STYLE === 'block') {
      for (const def of ROPES) {
        const a = new StaticBody(def.x - ANCHOR_W / 2, CEILING_Y - ANCHOR_H,
                                 ANCHOR_W, ANCHOR_H);
        a.color = '#3d3d52';
        if (!ANCHOR_SOLID) a.solid = false;
        world.add(a);
      }
    }

    // exit platform + goal
    const plat = new StaticBody(EXIT_X, EXIT_PLAT_Y, EXIT_PLAT_W, 22);
    plat.color = PLATFORM_COLOR;
    world.add(plat);

    const goal = new TriggerZone(EXIT_X + EXIT_PLAT_W - 100, EXIT_PLAT_Y - 60, 80, 60,
                                 { effect: 'goal', kind: 'exit' });
    goal.color = GOAL_COLOR;
    world.add(goal);
    nw.triggers.push(goal);

    // No rope entities at all now — the shape is derived from `theta` and
    // `len`, which the host broadcasts a few times a second.
    for (const r of ropeObjs) {
      r.len = ROPES[r.index].restLen;
      r.latched = false;
      r.theta = 0; r.omega = 0;
      const pt = r.pointAt(r.len);
      r.tip = new RopeTip(pt.x - TIP_SIZE / 2, pt.y - TIP_SIZE / 2);
      world.add(r.tip);
    }

    // controller last — static build order above it is unchanged, so host
    // and client still agree on every static entity id.
    ropeSystem = new RopeSystem(ropeObjs);
    world.add(ropeSystem);

    // Drive the rope from the world's own step, so it runs on the fixed
    // sim timestep and — crucially — AFTER the physics pass, which is
    // what stops riders bobbing. Wrapping the instance method leaves
    // engine.js untouched. If the engine's tick is named something else,
    // the aliases and the rAF fallback still cover it.
    for (const name of ['step', 'update', 'tick']) {
      if (typeof world[name] === 'function' && !world['__ropeWrapped_' + name]) {
        const orig = world[name].bind(world);
        world['__ropeWrapped_' + name] = true;
        world[name] = function (dt) {
          const out = orig(dt);
          try { ropeSystem._driver = 'world.' + name; ropeSystem.tickRope(dt); }
          catch (e) {}
          return out;
        };
        break;
      }
    }

    nw.winCondition = { type: 'reach-goal', mode: 'each', goals: [goal] };
  },
};

/* ---- rope line art, pinned to the interpolated coil positions so it
        looks identical on host and clients. ---- */
window.LevelDraw = function (ctx, list, t) {
  // Match each rope's tip by nearest pivot rather than by identity — the
  // client's tips are makeLocal copies of the host's.
  const tips = [];
  for (let i = 0; i < list.length; i++) {
    const it = list[i], e = it.entity;
    if (!e) continue;
    const isTip = e.kind === 'ropetip' ||
                  (e.isBouncingBall && e.w <= TIP_SIZE + 2 && e.h <= TIP_SIZE + 2);
    if (!isTip) continue;
    tips.push({ x: it.x + (e.w || TIP_SIZE) / 2, y: it.y + (e.h || TIP_SIZE) / 2 });
  }
  if (ROPE_DEBUG) window.__ropeTips = tips.length;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let ri = 0; ri < ROPES.length; ri++) {
    const px = ROPES[ri].x, py = CEILING_Y;
    let tip = null, bestD = Infinity;
    for (const c of tips) {
      const d = Math.hypot(c.x - px, c.y - py) + Math.abs(c.x - px) * 0.5;
      if (d < bestD) { bestD = d; tip = c; }
    }
    if (!tip) continue;

    const path = [];
    for (let k = 0; k <= ROPE_SEGMENTS; k++) {
      const f = k / ROPE_SEGMENTS;
      path.push({ x: px + (tip.x - px) * f, y: py + (tip.y - py) * f });
    }
    const trace = () => {
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let k = 1; k < path.length; k++) ctx.lineTo(path[k].x, path[k].y);
    };
    trace(); ctx.strokeStyle = 'rgba(0,0,0,0.40)';        ctx.lineWidth = 7;   ctx.stroke();
    trace(); ctx.strokeStyle = ROPE_COLOR;                ctx.lineWidth = 4;   ctx.stroke();
    trace(); ctx.strokeStyle = 'rgba(255,235,200,0.30)';  ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#8a6a3d';
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- debug readout: which input field was found, and who's holding
  //     ACTION right now. Delete this block once grabbing works. ---
  if (ROPE_DEBUG) {
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = window.__ropeInput === 'NOT FOUND' ? '#ff8a8a' : '#8affa0';
    ctx.fillText('input src: ' + (window.__ropeInput || '(waiting)'), 12, CEILING_Y + 26);
    ctx.fillStyle = '#c8c8d8';
    ctx.fillText('action held: ' + (window.__ropeAction || '-'), 12, CEILING_Y + 42);
    ctx.fillText('riders: ' + (window.__ropeRiders || 0), 12, CEILING_Y + 58);
    ctx.fillStyle = window.__ropeDriver ? '#8affa0' : '#ff8a8a';
    ctx.fillText('driver: ' + (window.__ropeDriver || 'NOTHING TICKING'), 12, CEILING_Y + 74);
    ctx.fillStyle = '#c8c8d8';
    ctx.fillText('local input: ' + (window.__ropeLoc || '-'), 12, CEILING_Y + 90);
    ctx.fillStyle = '#ffd18a';
    ctx.fillText('raw mask: ' + (window.__ropeMask || '-') + '   (DOWN = bit 16)',
                 12, CEILING_Y + 106);
    ctx.fillText('local .down: ' + (window.__ropeLocDown || '-'), 12, CEILING_Y + 122);
    ctx.fillText('slide now: ' + (window.__ropeSliding || '-'), 12, CEILING_Y + 138);
    ctx.fillStyle = '#c8c8d8';
    ctx.fillText('rope tips: ' + (window.__ropeTips || 0) + ' / ' + ROPES.length,
                 12, CEILING_Y + 154);
    if (window.__ropeErr) {
      ctx.fillStyle = '#ff8a8a';
      ctx.fillText('level err: ' + window.__ropeErr, 12, CEILING_Y + 186);
    }
  }
  ctx.restore();
};

/* ---- host-side rAF fallback ------------------------------------------
   If the engine never calls any of the tick aliases above, nothing moves
   and nothing can be grabbed. This drives the rope system directly from
   the render loop instead, at a clamped fixed-ish dt.

   It only runs on the host: Host.nw exists and holds the live world only
   on the simulating peer, so clients never enter this and their rope
   positions keep coming from snapshots as normal. It also stands down the
   moment the engine proves it IS calling us. */
(function ropeFallback() {
  let last = performance.now();
  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!theWorld || !ropeSystem) return;

    const H = window.Netcode && window.Netcode.Host;
    const isHost = !!(H && H.nw && typeof H.tick === 'number');
    if (!isHost) return;

    // engine is driving it — leave it alone
    if (now - ropeSystem.lastDriven < 250) return;
    ropeSystem._driver = 'raf';
    ropeSystem.tickRope(dt);
  }
  requestAnimationFrame(loop);
})();

} catch (__levelErr) {
  // A crash in level code must never take the page down with it.
  window.__ropeErr = 'level script: ' + (__levelErr && __levelErr.message || __levelErr);
  console.error('[level-rope] level script failed:', __levelErr);
}
})();
</script>

<script>
"use strict";
(function () {

const { Host, Client, CFG, PALETTE } = window.Netcode;
const { Box, Player } = window.Engine;

const $ = id => document.getElementById(id);

// Where "back to lobby" goes. Relative to this page — adjust if level
// pages ever move into a subfolder relative to the lobby.
const LOBBY_URL = 'index.html';
const boot = $('boot'), bootStatus = $('bootStatus'), stage = $('stage'),
      hudEl = $('hud'), canvas = $('game');
const ctx = canvas.getContext('2d');

const setStatus = m => { bootStatus.textContent = m; };

const input = new window.InputManager();
window.__gameInput = input;
window.bindTouchButton($('btnLeft'),   input, 'left');
window.bindTouchButton($('btnRight'),  input, 'right');
window.bindTouchButton($('btnJump'),   input, 'jump');
window.bindTouchButton($('btnAction'), input, 'action');
window.bindTouchButton($('btnDown'),   input, 'down');

let side = null, peer = null, running = false, myPeerId = null;

// Matches the (pointer: coarse) media query that reveals #touch, so the
// view lift and the buttons can never disagree about whether the pad is
// on screen.
const TOUCH_UI = window.matchMedia('(pointer: coarse)').matches;
// How far up the world is nudged to clear the control pad, in screen px.
const TOUCH_VIEW_LIFT = 40;

const animStates = new WeakMap();
let lastFrameAt = performance.now();

let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- view rect ----------
   The region of level-space the window shows. In 'whole' mode that's the
   entire level (the original letterbox behaviour). In 'follow' mode it's
   engine.js's Camera, which already tracks the average of the live
   players and is clamped to levelBounds — it was being simulated and
   synced all along (nw.cameras[0], a static-lifecycle entry in netcode's
   TYPE_REGISTRY with blended x/y), it just was never rendered through.
   Reading it rather than recomputing a follow point locally means host
   and clients frame the shot identically, and the camera's collision
   walls line up with what you can actually see. */
function viewRect() {
  if (window.Level.VIEW_MODE === 'follow' && side && side.nw &&
      side.nw.cameras && side.nw.cameras[0]) {
    const c = side.nw.cameras[0];
    return { x: c.x, y: c.y, w: c.w, h: c.h };
  }
  return { x: 0, y: 0, w: window.Level.WIDTH, h: window.Level.HEIGHT };
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// ---- mobile fullscreen on rotate --------------------------------------
// Touch devices only. Turning to landscape goes fullscreen (the browser
// chrome eats a lot of the width this shared-screen level needs);
// turning back to portrait, or leaving fullscreen by any other route,
// puts the device back exactly how it was.
//
// The catch: requestFullscreen() needs a user gesture, and an
// orientationchange event does NOT count as one in Chrome/Firefox. So
// when the direct attempt is rejected we arm a one-shot listener and go
// fullscreen on the player's very next touch instead — which in practice
// is immediate, since they rotated in order to play. iOS Safari on
// iPhone has no element fullscreen at all; there the promise rejects,
// the armed touch also fails, and nothing breaks — the page just stays
// as it is. webkitRequestFullscreen is included for iPad and older
// WebKit.
const isTouch = window.matchMedia('(pointer: coarse)').matches;
const isLandscape = () => window.matchMedia('(orientation: landscape)').matches;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

// What the orientation lock was before we touched it, so exiting can put
// it back rather than just guessing 'portrait'. null = never locked.
let priorOrientation = null;
let armed = false;

function lockLandscape() {
  const o = screen.orientation;
  if (!o || typeof o.lock !== 'function') return;
  if (priorOrientation === null) priorOrientation = o.type || null;
  // Rejects on desktop and on browsers that gate it — harmless either way.
  o.lock('landscape').catch(() => {});
}

function restoreOrientation() {
  const o = screen.orientation;
  if (o && typeof o.unlock === 'function' && priorOrientation !== null) {
    try { o.unlock(); } catch (e) {}
  }
  priorOrientation = null;
}

function armGesture() {
  if (armed) return;
  armed = true;
  const go = () => {
    armed = false;
    window.removeEventListener('pointerdown', go);
    window.removeEventListener('touchend', go);
    if (isLandscape()) enterFullscreen();
  };
  window.addEventListener('pointerdown', go, { once: true });
  window.addEventListener('touchend', go, { once: true });
}

function enterFullscreen() {
  if (!isTouch || fsEl()) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  let p;
  try { p = req.call(el, { navigationUI: 'hide' }); } catch (e) { p = null; }
  if (p && typeof p.then === 'function') {
    p.then(lockLandscape).catch(armGesture);
  } else {
    // Older WebKit returns undefined rather than a promise.
    lockLandscape();
  }
}

function exitFullscreen() {
  restoreOrientation();
  if (!fsEl()) return;
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (ex) { try { ex.call(document); } catch (e) {} }
}

function syncFullscreenToOrientation() {
  if (!isTouch) return;
  if (isLandscape()) enterFullscreen();
  else exitFullscreen();
}

if (isTouch) {
  window.addEventListener('orientationchange', () => setTimeout(syncFullscreenToOrientation, 150));
  // orientationchange is deprecated and missing on some Android builds;
  // the media query fires reliably there. Both routes are idempotent.
  const mq = window.matchMedia('(orientation: landscape)');
  const onMq = () => syncFullscreenToOrientation();
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);

  // Leaving fullscreen by any other route — swipe-down, back button, Esc
  // — must also release the orientation lock, or the device stays stuck
  // in landscape after the player has left the game.
  const onFsChange = () => { if (!fsEl()) restoreOrientation(); setTimeout(resize, 60); };
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // Already sideways when the page opened.
  if (isLandscape()) armGesture();
}

// Previous on-screen position per entity, so an arrow's heading can be
// derived from its actual movement. Clients never receive velocity (see
// netcode.js's Codec), so this is the only way to know which way a
// projectile is pointing there — same technique character.js already
// uses for its own velocity fallback. WeakMap so despawned projectiles
// clean themselves up.
const lastPos = new WeakMap();

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

// A real arrow: shaft + head + fletching, rotated to face its heading.
function drawArrow(x, y, w, h, angle) {
  const cx = x + w / 2, cy = y + h / 2;
  const len = Math.max(w, h);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // shaft
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-len / 2, 0);
  ctx.lineTo(len / 2 - 5, 0);
  ctx.stroke();

  // head
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.moveTo(len / 2, 0);
  ctx.lineTo(len / 2 - 7, -4.5);
  ctx.lineTo(len / 2 - 7, 4.5);
  ctx.closePath();
  ctx.fill();

  // fletching
  ctx.strokeStyle = '#e2554f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-len / 2, 0);      ctx.lineTo(-len / 2 + 6, -4);
  ctx.moveTo(-len / 2, 0);      ctx.lineTo(-len / 2 + 6, 4);
  ctx.moveTo(-len / 2 + 3, 0);  ctx.lineTo(-len / 2 + 9, -4);
  ctx.moveTo(-len / 2 + 3, 0);  ctx.lineTo(-len / 2 + 9, 4);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const now = performance.now();
  const animDt = Math.min(0.05, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  const t = now / 1000;

  const W = window.Level.WIDTH, H = window.Level.HEIGHT;
  const view = viewRect();
  const cw = window.innerWidth, ch = window.innerHeight;
  // Fill the window in follow mode (max, so no letterbox bars around a
  // small camera rect); fit the whole thing in whole-level mode (min).
  scale = window.Level.VIEW_MODE === 'follow'
    ? Math.max(cw / view.w, ch / view.h)
    : Math.min(cw / view.w, ch / view.h);
  offX = (cw - view.w * scale) / 2;
  offY = (ch - view.h * scale) / 2;

  // On touch devices the control pad occupies the bottom strip of the
  // window, and the action is at ground level — so a centred view puts
  // the players right behind the buttons. Shift the whole view up by
  // roughly half the pad's height: the characters clear the buttons, and
  // the extra room opens up above them, where the arrows come from.
  // Screen-space, applied after scale, so it's a constant number of
  // pixels regardless of how far the camera is zoomed.
  if (TOUCH_UI) offY -= TOUCH_VIEW_LIFT;

  ctx.save();
  ctx.setTransform(canvas.width / cw, 0, 0, canvas.height / ch, 0, 0);
  
  // Clear canvas so the 3D Three.js background shows through
  ctx.clearRect(0, 0, cw, ch);
  
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.translate(-view.x, -view.y);

  const list = side.renderList();

  if (typeof window.LevelDraw === 'function') {
    try { window.LevelDraw(ctx, list, t); }
    catch (err) { console.warn('LevelDraw threw:', err); }
  }

  for (let i = 0; i < list.length; i++) {
    const e = list[i].entity;
    if (!e.isWindZone) continue;
    ctx.fillStyle = e.color;
    ctx.fillRect(list[i].x, list[i].y, e.w, e.h);
  }

  for (let i = 0; i < list.length; i++) {
    const it = list[i], e = it.entity;
    if (e.isWindZone) continue;
    // Camera boundary walls are invisible collision helpers, not scenery
    // (engine.js sets isCameraWall on them) — drawing them is what put
    // those stray rectangles on screen.
    if (e.isCameraWall) continue;
    // rope tips are invisible carriers; LevelDraw draws the rope itself
    if (e.kind === 'ropetip') continue;
    if (e.isBouncingBall && e.w <= 8 && e.h <= 8) continue;
    const x = it.x, y = it.y;

    if (e instanceof Player) {
      let anim = animStates.get(e);
      if (!anim) { anim = window.Character.createAnimState(); animStates.set(e, anim); }
      const vx = (side === Host) ? e.vx : undefined;
      const vy = (side === Host) ? e.vy : undefined;
      // engine.js sets `dead` on the player and syncs it (see Player's
      // snapshot contract) — character.js has a dead pose, so pass the
      // real flag through rather than a hardcoded false.
      window.Character.update(anim, animDt, {
        x, y, vx, vy, facing: e.facing, grounded: e.grounded, dead: !!e.dead,
      });
      window.Character.draw(ctx, anim, { x, y, w: e.w, h: e.h, color: e.color });

    } else if (e.isProjectile || e.kind === 'arrow') {
      const prev = lastPos.get(e);
      let angle = Math.PI / 2; // falling straight down until we have a delta
      if (prev) {
        const dx = x - prev.x, dy = y - prev.y;
        if (dx * dx + dy * dy > 0.01) angle = Math.atan2(dy, dx);
        else if (prev.angle !== undefined) angle = prev.angle;
      }
      lastPos.set(e, { x, y, angle });
      drawArrow(x, y, e.w, e.h, angle);

    } else if (e.kind === 'death-orb') {
      // Drawn as a sibling of the decorative orb (same size, same bob) so
      // it doesn't announce itself as a hazard from across the level —
      // only the colour differs, and you have to get close to read it.
      // Host and client both run this Level.build(), so `kind` is set
      // locally on both sides and this branch is reached identically.
      const cx = x + e.w / 2, cy = y + e.h / 2 + 3 * Math.sin(t * 2 + x * 0.05);
      const pulse = 0.5 + 0.5 * Math.sin(t * 3.4);
      ctx.save();
      ctx.shadowColor = 'rgba(217,79,79,0.9)';
      ctx.shadowBlur = 10 + 10 * pulse;
      ctx.fillStyle = 'rgba(217,79,79,' + (0.6 + 0.35 * pulse) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, e.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,220,220,0.85)';
      ctx.beginPath(); ctx.arc(cx, cy, e.w / 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    } else if (e.isTriggerZone || e.kind === 'exit') {
      // Goal: pulsing glow + chevron, so it reads as "the thing to reach"
      // rather than a yellow rectangle.
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.4);
      ctx.save();
      ctx.shadowColor = 'rgba(240,196,25,0.9)';
      ctx.shadowBlur = 14 + 10 * pulse;
      ctx.fillStyle = 'rgba(240,196,25,' + (0.16 + 0.12 * pulse) + ')';
      roundRect(x, y, e.w, e.h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,224,138,' + (0.55 + 0.35 * pulse) + ')';
      ctx.lineWidth = 2;
      roundRect(x, y, e.w, e.h, 6); ctx.stroke();

      const cx = x + e.w / 2, cy = y + e.h / 2;
      const bob = 3 * Math.sin(t * 2.4);
      ctx.strokeStyle = 'rgba(255,236,180,0.95)';
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy + 4 + bob);
      ctx.lineTo(cx,     cy - 5 + bob);
      ctx.lineTo(cx + 9, cy + 4 + bob);
      ctx.stroke();
      ctx.restore();

    } else if (e.solid === false) {
      // Small decorative markers — soft dot instead of a hard square.
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 2 + x * 0.05);
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(x + e.w / 2, y + e.h / 2, e.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    } else {
      // Platforms: body, lit top edge, subtle grounding shadow beneath.
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      roundRect(x + 2, y + 4, e.w, e.h, 4); ctx.fill();
      ctx.fillStyle = e.color || '#4a4a5e';
      roundRect(x, y, e.w, e.h, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(x + 2, y + 1.5, e.w - 4, 3, 1.5); ctx.fill();
    }

    if (e instanceof Box && e.carried) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 1, y + 1, e.w - 2, e.h - 2);
    }
  }
  ctx.restore();
}

function mySlot() { return side === Host ? Host.mySlot : Client.mySlot; }

function hud() {
  if (side === Host) {
    hudEl.textContent =
      `HOST players:${Host.nw.players.size}  tick:${Host.tick}  ` +
      `steps:${Host.stats.steps}  sim:${Host.stats.simMs.toFixed(2)}ms  ` +
      `${CFG.SIM_HZ}Hz sim / ${CFG.SNAPSHOT_HZ}Hz net`;
  } else {
    const s = Client.stats;
    const stale = s.lastRecv ? Math.round(performance.now() - s.lastRecv) : 0;
    hudEl.textContent =
      `CLIENT slot:${Client.mySlot}  gap:${Math.round(s.gap)}ms  since:${stale}ms  ` +
      `snaps:${s.snaps}  teleports:${s.teleports}`;
  }
}

/* ---------- countdown ----------
   Implemented by simply NOT calling side.update(now) until it expires.
   On the host that freezes the whole simulation — no gravity, no arrows,
   no snapshots go out — so there is no way to die during the countdown
   and no need to separately gate input. Clients are frozen for the same
   reason: with no snapshots arriving there is nothing to advance to.
   That's why this is safe to run locally on each side without syncing
   the countdown itself over the wire. */
const COUNTDOWN_SECS = 3;
let countdownEndsAt = 0;

function startCountdown() {
  countdownEndsAt = performance.now() + COUNTDOWN_SECS * 1000;
  $('countdown').classList.add('on');
}

function tickCountdown(now) {
  if (!countdownEndsAt) return false;
  const left = countdownEndsAt - now;
  if (left <= 0) {
    countdownEndsAt = 0;
    $('countdown').classList.remove('on');
    showToast('GO!', 700);
    return false;
  }
  const secs = Math.ceil(left / 1000);
  const el = $('cdNum');
  const label = secs <= 0 ? 'GO' : String(secs);
  if (el.textContent !== label) {
    el.textContent = label;
    // Re-trigger the pop animation on each new number.
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  return true;
}

/* ---------- transient messages ---------- */
let toastTimer = null;
function showToast(msg, ms) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms || 1400);
}

/* ---------- death / restart + exit feedback ----------
   Both are derived from state that's already synced, so they work
   identically on host and client without new messages: `dead` is part of
   the player snapshot, and a player vanishing from the world is how
   'each' mode removes someone who went through the portal. */
let wasDead = false;
let lastPlayerCount = -1;
let peakPlayerCount = 0;
let lastResetGen = -1;

function updateFeedback() {
  const slot = mySlot();
  const players = side === Host ? side.nw.players
                                : (Client.nw ? Client.nw.players : null);
  if (!players) return;

  const me = players.get(slot);
  const dead = !!(me && me.dead);
  if (dead && !wasDead) showToast('Hit! Restarting…', 1500);
  wasDead = dead;

  // Exit progress. peakPlayerCount is the high-water mark rather than a
  // fixed total, because a level page can be joined mid-session and the
  // authoritative room size isn't exposed to clients — the number of
  // players ever seen at once is the closest honest stand-in.
  const n = players.size;
  if (n > peakPlayerCount) peakPlayerCount = n;
  if (n !== lastPlayerCount) {
    if (lastPlayerCount >= 0 && n < lastPlayerCount && me) {
      showToast('A player made it through!', 1200);
    }
    lastPlayerCount = n;
  }
  const out = Math.max(0, peakPlayerCount - n);
  const prog = $('exitProg');
  if (peakPlayerCount > 1) {
    prog.textContent = out + ' / ' + peakPlayerCount + ' through the portal';
    prog.classList.add('on');
  } else {
    prog.classList.remove('on');
  }

  // A player leaving can force the level to restart (netcode's 'each'
  // mode won't hand out a win nobody earned — see Host.drop). That comes
  // through as the world's reset generation ticking over while nobody
  // died, so it needs its own message rather than the "Hit!" one.
  const gen = side === Host ? side.nw.world.resetGeneration : Client.resetGen;
  if (typeof gen === 'number') {
    if (lastResetGen >= 0 && gen !== lastResetGen && !dead) {
      // Everyone reappearing at once means the room was rebuilt, not that
      // one person respawned.
      if (n > lastPlayerCount) showToast('A player left — restarting.', 1800);
      peakPlayerCount = n;
    }
    lastResetGen = gen;
  }
}

function frame(now) {
  if (!running) return;
  const counting = tickCountdown(now);
  if (!counting) {
    side.update(now);
    updateFeedback();
  }
  draw();
  hud();
  requestAnimationFrame(frame);
}

function endSession(reason) {
  running = false;
  clearInterval(voiceHeartbeat);
  $('endedMsg').textContent = reason || 'Session ended';
  $('ended').classList.add('on');
  try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
}
// Reload starts clean. Without clearing this, a reload after finishing
// would try to resume the session we just wrote for the hand-off — and
// on the 'done' branch that snapshot is intentionally null, which the
// resume path can't rebuild a room from.
$('endedBtn').onclick = () => {
  try { sessionStorage.removeItem('dt-session'); } catch (e) {}
  location.reload();
};
$('backBtn').onclick = () => {
  try { sessionStorage.removeItem('dt-session'); } catch (e) {}
  if (side === Host) { try { Host.shutdown(); } catch (e) {} }
  else if (side === Client) { try { Client.end('Leaving room'); } catch (e) {} }
  window.location.href = LOBBY_URL;
};

// --- level-complete hand-off ---
// Per the HANDOFF CONTRACT (netcode.js), this writes sessionStorage
// correctly for whichever role we are, then SHOULD navigate to
// LEVELS[msg.next].url — but that manifest (index -> URL) is owned by
// lobby.js, which this file doesn't have. Flagging rather than
// guessing a URL: session state is written correctly so the actual
// navigation line is a one-line addition once the manifest exists.
function onLevelComplete(msg) {
  running = false;
  $('exitProg').classList.remove('on');

  // Credit the local device for this level before going anywhere — it's
  // what unlocks the next tile in the lobby grid on this browser.
  try { if (window.Progress) window.Progress.markComplete(msg.level); } catch (e) {}

  try {
    const payload = (side === Host)
      ? { role: 'host', roomCode: Host.selfId,
          hostSnapshot: msg.done ? null : Host.snapshot(msg.next) }
      : { role: 'client', roomCode: Client.conn.peer,
          token: Client.myToken, level: msg.next };
    if (msg.done) { sessionStorage.removeItem('dt-session'); }
    else { sessionStorage.setItem('dt-session', JSON.stringify(payload)); }
  } catch (e) { console.error('[handoff] failed to persist session', e); }

  // Host only: detach the pagehide 'bye' broadcast BEFORE navigating, or
  // every client is told the session ended a split second before they
  // were going to follow us to the same page.
  if (side === Host) Host.prepareHandoff();

  if (msg.done) {
    $('endedMsg').textContent = 'All levels complete — nice work!';
    $('endedBtn').textContent = 'Back to lobby';
    $('ended').classList.add('on');
    $('endedBtn').onclick = () => { location.href = LOBBY_URL; };
    return;
  }

  let url = null;
  try { url = window.Levels.urlFor(msg.next); } catch (e) {}
  if (!url) {
    $('endedMsg').textContent = 'Level complete — but level ' + msg.next + ' has no page in levels.js.';
    $('endedBtn').textContent = 'Back to lobby';
    $('ended').classList.add('on');
    $('endedBtn').onclick = () => { location.href = LOBBY_URL; };
    return;
  }

  showToast('Level complete!', 1200);
  setTimeout(() => { location.href = url; }, 1000);
}

function begin(which) {
  side = which;
  boot.style.display = 'none';
  stage.classList.add('on');
  resize();
  running = true;

  const slot = mySlot();
  if (slot >= 0) {
    $('youAreSwatch').style.background = PALETTE[slot % PALETTE.length];
    $('youAre').classList.add('on');
  }

  initVoice();
  startCountdown();
  requestAnimationFrame(frame);
}

// --- voice/settings UI, backed by voicechat-adapter.js's VoiceUI ---
let voiceHeartbeat = null;

function currentRoster() {
  // Both sides now get the full room list, so voice is a true mesh:
  // the host reads its own peer map; a client reads the roster the host
  // pushes down (folded into 'welcome' on join/rejoin, re-sent on every
  // membership change — see VOICE ROSTER in netcode.js). Game traffic is
  // still star-only; these ids are used solely to place voice calls.
  if (side === Host) return Host.rosterIds();
  return (Client.roster && Client.roster.length) ? Client.roster
                                                  : [Client.conn.peer, myPeerId];
}

function renderVoicePanel() {
  if (!window.VoiceUI || !window.VoiceUI.isSupported()) return;
  const V = window.VoiceUI;

  $('selfMuteBtn').classList.toggle('muted', V.isSelfMuted());

  const mode = V.getMode();
  for (const btn of $('modeSwitch').children) {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  }

  const dotsEl = $('voiceDots');
  dotsEl.innerHTML = '';
  const peerListEl = $('peerList');
  peerListEl.innerHTML = '';
  for (const id of currentRoster()) {
    if (id === myPeerId) continue;
    const dot = document.createElement('div');
    dot.className = 'vdot' + (V.isPeerSpeaking(id) ? ' speaking' : '');
    dotsEl.appendChild(dot);

    const row = document.createElement('div');
    row.className = 'peerRow';
    const muteBtn = document.createElement('button');
    muteBtn.className = 'vbtn';
    muteBtn.style.width = '22px'; muteBtn.style.height = '22px'; muteBtn.style.fontSize = '11px';
    muteBtn.textContent = V.isPeerLocallyMuted(id) ? '🔇' : '🔊';
    muteBtn.onclick = () => V.togglePeerMute(id);
    const vol = document.createElement('input');
    vol.type = 'range'; vol.min = 0; vol.max = 100; vol.value = Math.round(V.getPeerVolume(id) * 100);
    vol.oninput = () => V.setPeerVolume(id, vol.value / 100);
    row.append(muteBtn, vol);
    peerListEl.appendChild(row);
  }
}

async function initVoice() {
  if (!window.VoiceUI || !window.VoiceUI.isSupported()) return;
  await window.VoiceUI.init(peer, { onSpeakingChange: renderVoicePanel, onPeerConnected: renderVoicePanel, onPeerDisconnected: renderVoicePanel });
  $('voiceBar').classList.add('on');

  // Re-mesh the moment membership changes, rather than waiting up to a
  // full heartbeat. Both sides expose the same hook.
  const onRosterChange = () => {
    window.VoiceUI.sync(currentRoster(), myPeerId);
    renderVoicePanel();
  };
  if (side === Host) Host.onRoster = onRosterChange;
  else Client.onRoster = onRosterChange;

  // Heartbeat stays as the self-healing backstop: sync() is idempotent,
  // so a roster message lost on the unreliable channel costs a couple of
  // seconds of missing voice rather than a permanently broken call.
  voiceHeartbeat = setInterval(() => {
    window.VoiceUI.sync(currentRoster(), myPeerId);
  }, 2000);
  window.VoiceUI.sync(currentRoster(), myPeerId);
  window.VoiceUI.onChange(renderVoicePanel);
  renderVoicePanel();
}

$('selfMuteBtn').onclick = () => window.VoiceUI && window.VoiceUI.toggleSelfMute();
$('settingsBtn').onclick = () => $('voicePanel').classList.toggle('on');
for (const btn of $('modeSwitch').children) {
  btn.onclick = () => window.VoiceUI && window.VoiceUI.setMode(btn.dataset.mode);
}
$('leaveBtn').onclick = () => {
  try { sessionStorage.removeItem('dt-session'); } catch (e) {}
  if (side === Host) { try { Host.shutdown(); } catch (e) {} }
  else { try { Client.end('You left.'); } catch (e) {} }
  endSession('You left the session.');
};

// PeerJS's signalling server connection can drop without the existing
// WebRTC data channels dying — established play continues fine, but no
// NEW peer can find us until it's back. Reconnecting keeps the room
// joinable instead of silently going dark.
function wirePeerRecovery() {
  if (!peer) return;
  peer.on('disconnected', () => {
    if (!peer || peer.destroyed) return;
    showToast('Reconnecting…', 1200);
    try { peer.reconnect(); } catch (e) {}
  });
}

// --- solo test path (no lobby exists yet to hand this off from) ---
// Uses an AUTO-ASSIGNED peer id (never a fixed room code), so it can
// never collide with a leftover id from a previous test run — that's
// what "ID taken" was: a stale registration of a FIXED id (the room
// code) from a prior session that hadn't cleared yet. This path doesn't
// need a fixed id at all since nobody else is joining.
function startSolo() {
  setStatus('Starting solo test…');
  peer = new Peer({ debug: 1 });
  peer.on('open', id => {
    myPeerId = id;
    Host.prepare(peer, setStatus, { totalLevels: 1, onComplete: onLevelComplete });
    Host.lock(0);
    Host.start(peer, input, setStatus, endSession);
    begin(Host);
  });
  wirePeerRecovery();
  peer.on('error', e => setStatus('Peer error: ' + e.type));
}
$('soloBtn').onclick = startSolo;

// --- entry: resume-only, per HANDOFF CONTRACT item 5. No host/join UI
// here — this page is only ever reached via hand-off from the lobby.
// Solo test button is the escape hatch until a real lobby exists. ---
function bootFromSession() {
  let sess = null;
  try { sess = JSON.parse(sessionStorage.getItem('dt-session') || 'null'); } catch (e) {}

  if (!sess) {
    setStatus('No session found.');
    $('soloBtn').style.display = 'inline-block';
    return;
  }

  if (sess.role === 'host') {
    if (!sess.hostSnapshot || !sess.hostSnapshot.roomCode) {
      // Written by a 'done' hand-off, or storage got mangled. Nothing to
      // rebuild a room from, so offer the clean path rather than throwing
      // deep inside restore().
      setStatus('That session has already finished.');
      $('soloBtn').style.display = 'inline-block';
      return;
    }
    setStatus('Reconnecting as host…');
    peer = new Peer(sess.roomCode, { debug: 1 });
    peer.on('open', id => {
      myPeerId = id;
      Host.restore(peer, sess.hostSnapshot, input, setStatus, endSession, onLevelComplete);
      begin(Host);
    });
    wirePeerRecovery();
    peer.on('error', e => {
      if (e.type === 'unavailable-id') {
        setStatus('Room code "' + sess.roomCode + '" is still registered from a previous session ' +
                   '(close any other tabs using it, or wait a moment and reload).');
      } else {
        setStatus('Peer error: ' + e.type);
      }
    });
  } else if (sess.role === 'client') {
    setStatus('Reconnecting…');
    peer = new Peer({ debug: 1 });
    peer.on('open', id => {
      myPeerId = id;
      const conn = peer.connect(sess.roomCode, { reliable: false, serialization: 'json' });
      conn.on('open', () => {
        Client.rejoin(conn, sess.token, input, setStatus, endSession, onLevelComplete);
        // Early warning of a degrading path — Client widens its
        // interpolation buffer rather than stuttering once packets
        // actually start arriving late.
        const pc = conn.peerConnection;
        if (pc) {
          pc.addEventListener('iceconnectionstatechange', () => {
            const st = pc.iceConnectionState;
            if (st === 'disconnected' || st === 'failed') Client.flagUnstable();
          });
        }
      });
      conn.on('data', msg => {
        Client.onData(msg);
        if (msg && msg.type === 'welcome' && !running) begin(Client);
      });
      conn.on('close', () => endSession('Host ended the session.'));
      conn.on('error', () => setStatus('Connection error.'));
    });
    wirePeerRecovery();
    peer.on('error', e => {
      setStatus(e.type === 'peer-unavailable'
        ? 'The host is no longer hosting that room.'
        : 'Peer error: ' + e.type);
    });
  } else {
    setStatus('Unrecognized session — open this level from the lobby.');
  }
}

resize();
bootFromSession();
})();
</script>
</body>
</html>
